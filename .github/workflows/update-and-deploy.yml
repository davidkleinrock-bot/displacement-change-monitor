# Keeps the dashboard current without anyone touching it:
#  - every day: re-download UNHCR + IDMC figures and GDELT headlines, re-run the checks, commit any changes
#  - after that, and on every push to main: publish the site to GitHub Pages
# If the numbers no longer add up (build-data.mjs exits with an error), nothing is committed or published,
# so the live site keeps the last good data.

name: Update data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC daily
  workflow_dispatch:
    inputs:
      news_hours:
        description: "Hours of GDELT news files to read (24 for a normal day; more to catch up)"
        default: "24"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download UNHCR, IDMC and map data
        run: node scripts/fetch-data.mjs
      - name: Build dashboard data and check it against UNHCR's totals
        run: node scripts/build-data.mjs
      - name: Read GDELT news files for displacement headlines (keeps the previous set on failure)
        run: node scripts/fetch-news.mjs
        env:
          NEWS_HOURS: ${{ inputs.news_hours || '24' }}
        continue-on-error: true
      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update data $(date -u +%Y-%m-%d)"
            git push
          fi

  deploy:
    needs: refresh
    if: ${{ !cancelled() && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # includes the data commit made by the refresh job
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
