# Keeps the dashboard current without anyone touching it. Every hour (and on every push to main):
#  1. Starts from the headlines already on the live site, so the 14-day news history carries over.
#  2. Asks UNHCR for a fingerprint of its figures. Only if UNHCR or IDMC published something new or revised
#     does it re-download everything, rebuild, re-check the totals, and commit the new data.
#  3. Reads the newest GDELT news files for displacement headlines.
#  4. Publishes the site to GitHub Pages.
# News is committed to the repo once a day (06:xx UTC); the other hourly runs only publish.
# If the totals check fails after a UNHCR release, the run fails, nothing is published or committed,
# and GitHub emails the repo owner, so the live site keeps the last good data.

name: Update data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "47 * * * *" # every hour at :47
  workflow_dispatch:
    inputs:
      news_hours:
        description: "Hours of GDELT news files to read (2 for a normal hourly run; more to catch up)"
        default: "2"
      force_data:
        description: "Re-download UNHCR data even if nothing changed"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Start from the headlines on the live site
        run: curl -fsSL "$SITE_URL/data/news.js" -o data/news.js || echo "Live site not reachable; using the repo copy."

      - name: Check whether UNHCR or IDMC published new figures
        id: unhcr
        run: node scripts/check-unhcr.mjs

      - name: Download and rebuild UNHCR data (only when something changed)
        if: steps.unhcr.outputs.changed == 'true' || inputs.force_data
        run: |
          node scripts/fetch-data.mjs
          node scripts/build-data.mjs

      - name: Refresh the list of reputable news outlets (daily, from Wikipedia and Lin et al. 2023)
        run: |
          if [ "$(date -u +%H)" = "06" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/fetch-sources.mjs || echo "Could not refresh; keeping the previous list."
          else
            echo "Using the saved list (refreshed daily at 06 UTC)."
          fi

      - name: Read GDELT news files for displacement headlines
        run: node scripts/fetch-news.mjs
        env:
          NEWS_HOURS: ${{ inputs.news_hours || '2' }}
        continue-on-error: true

      - name: Save to the repo (new UNHCR data, or the daily news snapshot)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          elif [ "${{ steps.unhcr.outputs.changed }}" = "true" ] || [ "${{ inputs.force_data }}" = "true" ]; then
            git commit -m "New UNHCR data $(date -u +%Y-%m-%d)"
            git pull --rebase -q origin main && git push
          elif [ "$(date -u +%H)" = "06" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git commit -m "Daily news snapshot $(date -u +%Y-%m-%d)"
            git pull --rebase -q origin main && git push
          else
            echo "Hourly news update: published to the site without a commit."
          fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
