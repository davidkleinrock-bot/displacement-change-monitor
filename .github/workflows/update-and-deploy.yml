# Keeps the dashboard current without anyone touching it. Every hour (and on every push to main):
#  1. Starts from the headlines already on the live site, so the news history carries over.
#  2. Asks UNHCR for a fingerprint of its figures. Only if UNHCR or IDMC published something new or revised
#     does it re-download everything, rebuild, re-check the totals, and commit the new data.
#  3. Reads every GDELT news file (English and translated) published since the previous run (GitHub starts
#     this "hourly" job only 5-7 times a day, so a fixed 2-hour lookback would skip hours), the RSS feeds of
#     hand-picked outlets, and ReliefWeb reports (once the RELIEFWEB_APPNAME variable is set); keeps two calendar months of news.
#     Spanish, French and Portuguese headlines get an English machine translation, made on this computer
#     with the free OPUS-MT model (the library and model are not published with the site).
#  4. Publishes the site to GitHub Pages.
# News is committed to the repo about once a day (when the last news commit is over 20 hours old);
# other runs only publish. Tests run before anything is published.
# If the totals check fails after a UNHCR release, the run fails, nothing is published or committed,
# and GitHub emails the repo owner, so the live site keeps the last good data.

name: Update data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "47 * * * *" # every hour at :47
  workflow_dispatch:
    inputs:
      news_hours:
        description: "Hours of GDELT news files to read. Leave empty for a normal run (everything since the last run). 1464 = two months, for a backfill."
        default: ""
      news_step:
        description: "Read every Nth 15-minute English file (1 = all; larger values make a quick, sampled backfill)"
        default: "1"
      news_tr_step:
        description: "Read every Nth 15-minute translated (non-English) file. Leave empty to use news_step."
        default: ""
      force_data:
        description: "Re-download UNHCR data even if nothing changed"
        type: boolean
        default: false
      deploy:
        description: "Publish the result to the live site (turn off to test a branch without changing the site)"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180 # a two-month backfill reads about 5,900 English files plus translated ones
    env:
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Start from the newer of the live site's headlines and the repo's
        run: |
          if curl -fsSL "$SITE_URL/data/news.js" -o "$RUNNER_TEMP/live-news.js"; then
            node -e '
              const fs = require("fs");
              const load = (p) => { try { const s = fs.readFileSync(p, "utf8"); return JSON.parse(s.slice(s.indexOf("{"), s.lastIndexOf("}") + 1)); } catch { return null; } };
              const L = load(process.argv[1]), R = load("data/news.js");
              const live = L?.retrievedAt || "", repo = R?.retrievedAt || "";
              // A live file written by the rules before Nov 2026 has no feed counts; starting from it would drop most saved articles.
              if (live > repo && L?.lastRun?.feeds) { fs.copyFileSync(process.argv[1], "data/news.js"); console.log(`Using the live site copy (${live}).`); }
              else console.log(`Keeping the repo copy (${repo}); live is ${live || "unreadable"}.`);
            ' "$RUNNER_TEMP/live-news.js"
          else
            echo "Live site not reachable; using the repo copy."
          fi

      - name: Check whether UNHCR or IDMC published new figures
        id: unhcr
        run: node scripts/check-unhcr.mjs

      - name: Download and rebuild UNHCR data (only when something changed)
        if: steps.unhcr.outputs.changed == 'true' || inputs.force_data
        run: |
          node scripts/fetch-data.mjs
          node scripts/build-data.mjs

      - name: Install the translation library (free, runs on this computer, no account)
        run: npm install --no-save --no-package-lock --no-audit --no-fund @huggingface/transformers@4.3.2
        continue-on-error: true

      - name: Keep the translation model between runs
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/hf-cache
          key: opus-mt-romance-en-q8-v1

      - name: Read news (GDELT files, outlet feeds) and ReliefWeb reports
        run: node scripts/fetch-news.mjs
        timeout-minutes: 165 # if it runs out, the steps below still publish the previous news file
        env:
          NEWS_HOURS: ${{ inputs.news_hours }}
          NEWS_STEP: ${{ inputs.news_step || '1' }}
          NEWS_BUDGET_MIN: 125 # stop reading GDELT files after this, leaving time to check articles and save
          NEWS_TR_STEP: ${{ inputs.news_tr_step }}
          # ReliefWeb's API appname (not a secret). Set it under Settings → Secrets and variables → Actions → Variables.
          RELIEFWEB_APPNAME: ${{ vars.RELIEFWEB_APPNAME }}
          HF_CACHE_DIR: ${{ runner.temp }}/hf-cache
        continue-on-error: true

      - name: Write the news coverage audit
        run: node scripts/news-coverage-audit.mjs

      - name: Run the tests
        run: node --test "tests/*.test.mjs"

      - name: Save to the repo (new UNHCR data, or the daily news snapshot)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/news-coverage-audit.md
          # Age of the news file last committed (the checkout has only one commit, so read the file itself).
          committed=$(git show HEAD:data/news.js 2>/dev/null | grep -o '"retrievedAt":"[^"]*"' | head -1 | cut -d'"' -f4)
          age=$(( $(date +%s) - $(date -d "${committed:-1970-01-01}" +%s) ))
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          elif [ "${{ steps.unhcr.outputs.changed }}" = "true" ] || [ "${{ inputs.force_data }}" = "true" ]; then
            git commit -m "New UNHCR data $(date -u +%Y-%m-%d)"
            git pull --rebase -q origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"
          elif [ "$age" -gt 72000 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git commit -m "Daily news snapshot $(date -u +%Y-%m-%d)"
            git pull --rebase -q origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"
          else
            echo "Hourly news update: published to the site without a commit."
          fi

      - name: Keep the translation library off the website
        run: rm -rf node_modules

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: update
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
